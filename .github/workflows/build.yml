name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - name: C tests (protocol + translations)
        working-directory: vita/tests
        run: |
          gcc -std=c11 -Wall -Wextra -I../src ../src/protocol.c test_protocol.c -o test_protocol -lm && ./test_protocol
          gcc -std=c11 -Wall -Wextra -I../src ../src/lang.c test_lang.c -o test_lang && ./test_lang
      - name: Server line through the C parser
        working-directory: server
        run: python test_server_line.py

  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build VPK
        run: |
          cd vita && mkdir -p build && cd build
          cmake .. && make
      - uses: actions/upload-artifact@v4
        with:
          name: VitaMon.vpk
          path: vita/build/VitaMon.vpk

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build VitaMon.exe
        shell: cmd
        run: server\build_exe.bat
      - uses: actions/upload-artifact@v4
        with:
          name: VitaMon.exe
          path: server/dist/VitaMon.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, vpk, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            VitaMon.vpk
            VitaMon.exe
          generate_release_notes: true
