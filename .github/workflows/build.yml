name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - name: C tests (protocol + translations)
        working-directory: vita/tests
        run: |
          gcc -std=c11 -Wall -Wextra -I../src ../src/protocol.c test_protocol.c -o test_protocol -lm && ./test_protocol
          gcc -std=c11 -Wall -Wextra -I../src ../src/lang.c test_lang.c -o test_lang && ./test_lang
      - name: Server line through the C parser
        working-directory: server
        run: python test_server_line.py
      - name: GPU readers with sample LibreHardwareMonitor data (NVIDIA, AMD, Intel)
        working-directory: server
        run: python test_gpu.py
      - name: RivaTuner FPS, update check and Vita reply
        working-directory: server
        run: python test_misc.py
      - name: Release tag matches server/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: server
        run: |
          expected="v$(python -c 'import version; print(version.APP_VERSION)')"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con server/version.py ($expected)"
            exit 1
          fi

  vpk:
    runs-on: ubuntu-24.04
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v7
      - name: Build VPK
        run: |
          cd vita && mkdir -p build && cd build
          cmake .. && make
      - uses: actions/upload-artifact@v7
        with:
          name: VitaMon.vpk
          path: vita/build/VitaMon.vpk

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build VitaMon.exe and VitaMon-windows.zip
        shell: cmd
        run: server\build_exe.bat
      - uses: actions/upload-artifact@v7
        with:
          name: VitaMon.exe
          path: server/dist/VitaMon.exe
      - uses: actions/upload-artifact@v7
        with:
          name: VitaMon-windows.zip
          path: server/dist/VitaMon-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, vpk, exe]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            VitaMon.vpk
            VitaMon.exe
            VitaMon-windows.zip
          generate_release_notes: true
          # etiquetas como v1.2.0-beta.1 se publican como beta (pre-release)
          prerelease: ${{ contains(github.ref_name, '-') }}
